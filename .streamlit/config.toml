[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#e0b15a"
backgroundColor = "#0c1220"
secondaryBackgroundColor = "#141c2e"
textColor = "#e7eef8"
font = "sans serif"
